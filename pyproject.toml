[project]
name = "toy-agent"
version = "0.1.0"
description = "A simple agentic coding assistant powered by Claude"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.75.0",
    "python-dotenv>=1.0.0",
    "prompt-toolkit>=3.0.0",
    "rich>=14.2.0",
    "watchdog>=6.0.0",
    "pathspec>=0.11.0",
]

[project.scripts]
toy-agent = "toy_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
